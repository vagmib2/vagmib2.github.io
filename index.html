<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAGMIB2 MONTPELLIER 34000 - VW Seat Skoda Audi Porsche</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#0a1931}
.header{background:#0a1931;color:white;padding:25px;text-align:center}
.header img{width:90px;height:90px;border-radius:50%;border:3px solid #00a8ff;object-fit:cover;display:block;margin:0 auto 10px}
.social{margin:12px 0}
.social a{display:inline-block;margin:5px;padding:9px 14px;border-radius:999px;text-decoration:none;font-weight:900;font-size:11px}
.insta{background:linear-gradient(45deg,#f09433,#dc2743,#bc1888);color:white}
.snap{background:#FFFC00;color:black;border:2px solid black}
.wa{background:#25D366;color:white}
.box{border:3px solid #00a8ff;background:#e6f0ff;border-radius:14px;padding:16px;margin:12px auto;max-width:800px;text-align:center;font-size:12px;line-height:1.7}
.tarifs{background:#fffbe6;border:2px solid #ffb100;border-radius:14px;padding:14px;margin:12px auto;max-width:800px;font-size:11px;line-height:2}
.grid{max-width:800px;margin:0 auto;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
.card{background:white;border:2px solid #0a1931;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card:hover{border-color:#00a8ff;box-shadow:0 0 20px rgba(0,168,255,.3)}
.head{padding:10px;background:#0a1931;color:white;font-weight:900;font-size:10px;text-align:center}
.price{padding:5px 12px;border-radius:999px;font-weight:900;font-size:11px;display:inline-block;margin:8px}
.photo{width:100%;height:220px;object-fit:cover;display:block;background:#ddd}
.hint{background:#00a8ff;color:black;text-align:center;padding:6px;font-weight:900;font-size:9px}
.btn{display:block;background:#25D366;color:black;text-align:center;padding:12px;border-radius:10px;font-weight:900;text-decoration:none;margin:10px;font-size:12px}
.footer{background:#0a1931;color:white;padding:20px;text-align:center;font-size:11px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:9999;padding:10px}.modal.open{display:flex}
.modal-box{background:white;color:black;border:3px solid #00a8ff;border-radius:20px;max-width:560px;width:100%;max-height:95vh;overflow-y:auto;position:relative}
.close{position:absolute;top:10px;right:10px;background:#ff1a1a;color:white;border:0;padding:8px 14px;border-radius:999px;font-weight:900;cursor:pointer}
.tbl{width:100%;border-collapse:collapse;font-size:11px}.tbl td{padding:8px;border-bottom:1px solid #ddd}.
